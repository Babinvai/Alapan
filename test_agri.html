<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #eee; font-family: sans-serif; }
        .village-agri-scene {
            position: relative;
            width: 100%;
            height: 400px;
            overflow: hidden;
            background: linear-gradient(to bottom, #87ceeb, #e0f6ff);
        }
        
        .agri-paddy-front {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to bottom, #5cb823 0%, #30750c 100%);
        }
        
        /* The Cart */
        .agri-cart {
            position: absolute;
            bottom: 30px;
            left: -20%;
            width: 300px;
            height: 120px;
            animation: cart-move 35s linear infinite;
            z-index: 3;
        }
        @keyframes cart-move {
            0% { left: -30%; }
            100% { left: 110%; }
        }
        
        .cart-group {
            width: 100%;
            height: 100%;
            animation: plow-bob 2s ease-in-out infinite alternate;
        }
        @keyframes plow-bob {
            0% { transform: translateY(0); }
            100% { transform: translateY(3px); }
        }
        .cart-wheel {
            transform-origin: 120px 95px;
            animation: wheel-spin 3s linear infinite;
        }
        @keyframes wheel-spin {
            100% { transform: rotate(360deg); }
        }
        .bull-leg-front { transform-origin: 270px 75px; animation: walk 1s infinite alternate; }
        .bull-leg-back { transform-origin: 240px 75px; animation: walk 1s infinite alternate-reverse; }
        @keyframes walk {
            0% { transform: rotate(-15deg); }
            100% { transform: rotate(15deg); }
        }
    </style>
</head>
<body>

<section class="village-agri-scene">
    <div class="agri-paddy-front"></div>
    
    <div class="agri-cart">
        <div class="cart-group">
            <svg class="cart-svg" viewBox="0 0 300 120" style="width: 100%; height: 100%; filter: drop-shadow(0 5px 3px rgba(0,0,0,0.4));">
                
                <!-- Crops/Hay -->
                <path d="M 50,70 Q 70,30 110,40 Q 140,20 170,50 Q 190,40 190,70 Z" fill="#d4aa37"/>
                <path d="M 60,70 Q 80,40 120,50 Q 150,30 180,60 L 180,70 Z" fill="#b8860b" opacity="0.6"/>

                <!-- Cart Body -->
                <rect x="50" y="70" width="140" height="20" fill="#5c3f22"/>
                <rect x="40" y="65" width="160" height="5" fill="#4a2e15"/>
                <rect x="40" y="85" width="160" height="5" fill="#4a2e15"/>
                <line x1="60" y1="65" x2="60" y2="90" stroke="#33200e" stroke-width="3"/>
                <line x1="100" y1="65" x2="100" y2="90" stroke="#33200e" stroke-width="3"/>
                <line x1="140" y1="65" x2="140" y2="90" stroke="#33200e" stroke-width="3"/>
                <line x1="180" y1="65" x2="180" y2="90" stroke="#33200e" stroke-width="3"/>

                <!-- Wooden Pole connecting to bullocks -->
                <line x1="190" y1="80" x2="250" y2="80" stroke="#5c3f22" stroke-width="6"/>
                <path d="M 230,70 L 235,90 L 225,90 Z" fill="#5c3f22"/>

                <!-- Driver -->
                <path d="M 195,75 L 185,50 L 205,60 Z" fill="#fff" opacity="0.9"/>
                <circle cx="195" cy="40" r="9" fill="#8c5a35"/>
                <path d="M 185,35 Q 195,25 205,35 Z" fill="#d9534f"/>
                <path d="M 185,80 L 195,80 L 190,50 Z" fill="#111"/>
                <line x1="195" y1="60" x2="230" y2="70" stroke="#8c5a35" stroke-width="3"/>

                <!-- Bullock 1 (Back) -->
                <path d="M 220,60 Q 250,55 270,60 Q 280,80 270,90 L 220,90 Z" fill="#e8d8c3"/>
                <path class="bull-leg-back" d="M 230,90 L 225,110" stroke="#e8d8c3" stroke-width="4"/>
                <path class="bull-leg-front" d="M 260,90 L 265,110" stroke="#e8d8c3" stroke-width="4"/>
                <circle cx="275" cy="55" r="11" fill="#e8d8c3"/>
                
                <!-- Bullock 2 (Front) -->
                <path d="M 230,65 Q 260,60 280,65 Q 290,85 280,95 L 230,95 Z" fill="#fff"/>
                <path class="bull-leg-back" d="M 240,95 L 235,115" stroke="#fff" stroke-width="5"/>
                <path class="bull-leg-front" d="M 270,95 L 275,115" stroke="#fff" stroke-width="5"/>
                <circle cx="285" cy="60" r="12" fill="#fff"/>
                <!-- Horns -->
                <path d="M 290,50 Q 295,45 300,50" fill="none" stroke="#333" stroke-width="2"/>
                <path d="M 280,48 Q 285,40 290,45" fill="none" stroke="#333" stroke-width="2"/>

                <!-- Wheel (Front) -->
                <g class="cart-wheel">
                    <circle cx="120" cy="95" r="22" fill="none" stroke="#33200e" stroke-width="4"/>
                    <circle cx="120" cy="95" r="5" fill="#33200e"/>
                    <line x1="120" y1="73" x2="120" y2="117" stroke="#33200e" stroke-width="2"/>
                    <line x1="98" y1="95" x2="142" y2="95" stroke="#33200e" stroke-width="2"/>
                    <line x1="104" y1="79" x2="136" y2="111" stroke="#33200e" stroke-width="2"/>
                    <line x1="104" y1="111" x2="136" y2="79" stroke="#33200e" stroke-width="2"/>
                </g>

            </svg>
        </div>
    </div>
</section>

</body>
</html>
