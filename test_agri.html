<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; background: #87ceeb; font-family: sans-serif; height: 100vh; overflow: hidden; }
        
        .grass { position: absolute; bottom: 0; width: 100%; height: 150px; background: #6bbd45; }
        
        .windmill-container {
            position: absolute;
            bottom: 145px;
            left: 75%;
            width: 80px;
            height: 120px;
            z-index: 1;
        }
        .windmill-tower { fill: #d4aa37; }
        .windmill-tower-shadow { fill: #b8860b; }
        .windmill-roof { fill: #8c2a2a; }
        .windmill-blades {
            transform-origin: 40px 40px;
            animation: spin-blades 12s linear infinite;
        }
        .windmill-blade-fabric {
            fill: #fffdf0;
            stroke: #8c6b54;
            stroke-width: 1;
        }
        @keyframes spin-blades {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="grass"></div>

<div class="windmill-container">
    <svg viewBox="0 0 80 120" style="width: 100%; height: 100%; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.3));">
        
        <!-- Tower Base -->
        <path class="windmill-tower" d="M 25,120 L 55,120 L 48,40 L 32,40 Z" />
        <path class="windmill-tower-shadow" d="M 40,120 L 55,120 L 48,40 L 40,40 Z" />
        
        <!-- Door/Windows -->
        <rect x="36" y="95" width="8" height="15" rx="4" fill="#4a2e15"/>
        <rect x="37" y="70" width="6" height="8" rx="2" fill="#4a2e15"/>
        <rect x="38" y="55" width="4" height="6" rx="2" fill="#4a2e15"/>
        
        <!-- Deck/Balcony -->
        <rect x="22" y="85" width="36" height="3" fill="#5c3f22"/>
        <line x1="22" y1="85" x2="30" y2="105" stroke="#5c3f22" stroke-width="2"/>
        <line x1="58" y1="85" x2="50" y2="105" stroke="#5c3f22" stroke-width="2"/>
        
        <!-- Roof -->
        <path class="windmill-roof" d="M 28,40 L 52,40 Q 40,20 40,15 Q 40,20 28,40 Z" />
        
        <!-- Blades -->
        <g class="windmill-blades">
            
            <!-- Blade 1 (Top) -->
            <rect class="windmill-blade-fabric" x="41" y="2" width="10" height="35" />
            <line x1="40" y1="0" x2="40" y2="40" stroke="#5c3f22" stroke-width="3"/>
            <line x1="38" y1="5" x2="52" y2="5" stroke="#5c3f22" stroke-width="1"/>
            <line x1="38" y1="15" x2="52" y2="15" stroke="#5c3f22" stroke-width="1"/>
            <line x1="38" y1="25" x2="52" y2="25" stroke="#5c3f22" stroke-width="1"/>
            
            <!-- Blade 2 (Right) -->
            <rect class="windmill-blade-fabric" x="43" y="41" width="35" height="10" />
            <line x1="40" y1="40" x2="80" y2="40" stroke="#5c3f22" stroke-width="3"/>
            <line x1="75" y1="38" x2="75" y2="52" stroke="#5c3f22" stroke-width="1"/>
            <line x1="65" y1="38" x2="65" y2="52" stroke="#5c3f22" stroke-width="1"/>
            <line x1="55" y1="38" x2="55" y2="52" stroke="#5c3f22" stroke-width="1"/>
            
            <!-- Blade 3 (Bottom) -->
            <rect class="windmill-blade-fabric" x="29" y="43" width="10" height="35" />
            <line x1="40" y1="40" x2="40" y2="80" stroke="#5c3f22" stroke-width="3"/>
            <line x1="28" y1="75" x2="42" y2="75" stroke="#5c3f22" stroke-width="1"/>
            <line x1="28" y1="65" x2="42" y2="65" stroke="#5c3f22" stroke-width="1"/>
            <line x1="28" y1="55" x2="42" y2="55" stroke="#5c3f22" stroke-width="1"/>
            
            <!-- Blade 4 (Left) -->
            <rect class="windmill-blade-fabric" x="2" y="29" width="35" height="10" />
            <line x1="0" y1="40" x2="40" y2="40" stroke="#5c3f22" stroke-width="3"/>
            <line x1="5" y1="28" x2="5" y2="42" stroke="#5c3f22" stroke-width="1"/>
            <line x1="15" y1="28" x2="15" y2="42" stroke="#5c3f22" stroke-width="1"/>
            <line x1="25" y1="28" x2="25" y2="42" stroke="#5c3f22" stroke-width="1"/>
            
            <!-- Center Hub -->
            <circle cx="40" cy="40" r="4" fill="#33200e"/>
        </g>
    </svg>
</div>
    <script type="module" src="firebase-config.js"></script>
</body>
</html>
